<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07539a"><meta name="description" content="Consulta offline de estoque por RG"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Consulta RG">
<link rel="manifest" href="/static/manifest.json">
<title>Consulta RG • Operacional</title>
<link rel="stylesheet" href="/static/style.css">

</head>
<body>
<header><div class="brand-header"><img class="jbs-logo header-logo" src="/static/jbs-logo.svg" alt="JBS"><div><strong>Consulta RG • Operacional</strong><span> • {{ user.user }}</span></div></div><a href="/logout">Sair</a></header>
<main>
<section class="hero card">
<h1>Consulta de Estoque</h1>
<p>Digite ou leia o RG da caixa/palete. <b>Consultas operacionais: OFFLINE.</b></p>
<div class="offline-bar"><span id="connection">🟢 Online</span><span id="syncStatus">Base local: verificando...</span><button id="installBtn" class="install-btn" onclick="instalarApp()">📲 Instalar aplicativo</button><button class="small" onclick="sincronizar()">↻ Sincronizar base</button></div>
<p class="app-hint">Depois de instalado, o Consulta RG aparece na tela inicial como um aplicativo.</p><div id="consultaTela">
<div id="resultado" class="result"></div>
<div class="search"><input id="rg" placeholder="Digite ou leia o RG" autofocus><button onclick="consultar()">🔎 Consultar</button></div>
<button class="secondary" onclick="startScanner()">📷 Ler QR Code</button>
<div id="reader"></div>
</div>
<div id="resultTela" class="result-screen" hidden>
<div id="result"></div>
<button class="new-search" onclick="novaPesquisa()">🔄 Nova pesquisa</button>
</div>
</section>
</main>
<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('installBtn').style.display='block'});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;document.getElementById('installBtn').style.display='none'});
async function instalarApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installBtn').style.display='none';return}alert('Use o menu do navegador e escolha Instalar aplicativo ou Adicionar à tela inicial.');}
const DB_NAME='consulta-rg-offline',DB_VERSION=2,STORE='estoque',ETIQUETA='etiquetas',META='meta',QUEUE='fila';
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'rg'});if(!db.objectStoreNames.contains(ETIQUETA))db.createObjectStore(ETIQUETA,{keyPath:'etiqueta_palete'});if(!db.objectStoreNames.contains(META))db.createObjectStore(META,{keyPath:'key'});if(!db.objectStoreNames.contains(QUEUE))db.createObjectStore(QUEUE,{autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPutMany(items){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction([STORE,ETIQUETA],'readwrite'),s=tx.objectStore(STORE),e=tx.objectStore(ETIQUETA);s.clear();e.clear();for(const x of items){if(x.rg)s.put(x);if(x.etiqueta_palete)e.put(x)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function dbGet(rg){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction([STORE,ETIQUETA]);const r=tx.objectStore(STORE).get(rg);r.onsuccess=()=>{if(r.result){resolve(r.result);return}const e=tx.objectStore(ETIQUETA).get(rg);e.onsuccess=()=>resolve(e.result||null);e.onerror=()=>reject(e.error)};r.onerror=()=>reject(r.error)})}
async function metaGet(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(META).objectStore(META).get('base');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function metaPut(v){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(META,'readwrite');tx.objectStore(META).put({key:'base',...v});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function queueAdd(x){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(QUEUE,'readwrite');tx.objectStore(QUEUE).add(x);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function queueAll(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(QUEUE).objectStore(QUEUE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function queueClear(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(QUEUE,'readwrite');tx.objectStore(QUEUE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function api(url,opt){const r=await fetch(url,{credentials:'include',...(opt||{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(d,offline=false){document.getElementById('consultaTela').hidden=true;document.getElementById('resultTela').hidden=false;document.getElementById('result').innerHTML=d.found?'<div class="ok"><h2>✓ RG localizado '+(offline?'• OFFLINE':'')+'</h2><p><b>RG:</b> '+esc(d.rg)+'</p><p><b>Posição esperada:</b> '+esc(d.posicao)+'</p><p><b>COD. PRODUTO:</b> '+esc(d.cod_produto)+'</p><p><b>Produto:</b> '+esc(d.produto)+'</p><p><b>Lote:</b> '+esc(d.lote)+'</p><p><b>Validade:</b> '+esc(d.validade)+'</p><p><b>Quantidade:</b> '+esc(d.quantidade)+'</p><p><b>Status:</b> '+esc(d.status)+'</p></div>':'<div class="bad"><h2>⚠ RG não encontrado '+(offline?'• OFFLINE':'')+'</h2><p><b>RG lido:</b> '+esc(d.rg)+'</p><p>O QR Code foi lido, mas não existe registro correspondente na base local.</p></div>'}
async function consultar(){
 const rg=document.getElementById('rg').value.trim();
 if(!rg)return;
 try{
  const d=await dbGet(rg);
  if(d){
   render({found:true,...d},true);
   await queueAdd({rg,found:true,consulted_at:new Date().toISOString()});
   if(navigator.onLine)enviarFila().catch(()=>{});
  }else{
   render({found:false,rg},true);
  }
  document.getElementById('rg').value='';
 }catch(e){
  alert('Base local indisponível. Sincronize a base antes de realizar consultas.');
 }
}
function novaPesquisa(){document.getElementById('resultTela').hidden=true;document.getElementById('consultaTela').hidden=false;document.getElementById('result').innerHTML='';document.getElementById('rg').value='';window.scrollTo({top:0,behavior:'instant'});setTimeout(()=>startScanner(),150)}
async function sincronizar(){if(!navigator.onLine){document.getElementById('syncStatus').textContent='Sem internet • usando última base';return}const el=document.getElementById('syncStatus');el.textContent='Sincronizando...';try{const d=await api('/api/sync');await dbPutMany(d.items);await metaPut({version:d.version,filename:d.filename,imported_at:d.imported_at,count:d.count,synced_at:new Date().toISOString()});el.textContent='Base local: '+d.count.toLocaleString('pt-BR')+' RGs • '+formatDate(d.imported_at);await enviarFila()}catch(e){el.textContent='Falha na sincronização';console.error(e)}}
async function enviarFila(){const q=await queueAll();if(!q.length||!navigator.onLine)return;try{await api('/api/consultations/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)});await queueClear()}catch(e){}}
function formatDate(s){if(!s)return 'sem importação';try{return new Date(s).toLocaleString('pt-BR')}catch{return s}}
async function atualizarStatus(){document.getElementById('connection').textContent=navigator.onLine?'🟢 Online':'🟠 OFFLINE';const m=await metaGet();document.getElementById('syncStatus').textContent=m?'Base local: '+Number(m.count||0).toLocaleString('pt-BR')+' RGs • '+formatDate(m.imported_at):'Base local: não sincronizada';}
let scanner;
function startScanner(){
 if(scanner)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('A câmera não está disponível. Use o leitor físico ou digite o RG.');return}
 if(!('BarcodeDetector' in window)){alert('Este navegador não oferece leitura de QR/Data Matrix pela câmera. Use o leitor físico ou digite o RG.');return}
 const detector=new BarcodeDetector({formats:['qr_code','data_matrix']});
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}).then(async stream=>{
  const reader=document.getElementById('reader');
  const v=document.createElement('video');
  v.srcObject=stream;v.setAttribute('playsinline','');v.muted=true;v.autoplay=true;
  reader.innerHTML='';reader.appendChild(v);
  scanner={stop:()=>{stream.getTracks().forEach(t=>t.stop());scanner=null;reader.innerHTML=''}};
  try{await v.play()}catch(e){}
  const loop=async()=>{
   if(!scanner)return;
   if(v.readyState>=2&&v.videoWidth>0){
    try{
     const codes=await detector.detect(v);
     if(codes.length&&codes[0].rawValue){
      const valor=String(codes[0].rawValue).trim();
      document.getElementById('rg').value=valor;
      stream.getTracks().forEach(t=>t.stop());
      scanner=null;
      reader.innerHTML='';
      consultar();
      return;
     }
    }catch(e){}
   }
   setTimeout(loop,100);
  };
  loop();
 }).catch(e=>{scanner=null;alert('Não foi possível acessar a câmera: '+e.message)});
}
window.addEventListener('online',()=>{atualizarStatus();sincronizar()});window.addEventListener('offline',atualizarStatus);
document.getElementById('rg').addEventListener('keydown',e=>{if(e.key==='Enter')consultar()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
atualizarStatus();
</script>
</body></html>\n
