<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta RG • Operacional</title><link rel="stylesheet" href="/static/style.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><header><div><strong>Consulta RG • Operacional</strong><span> • {{ user.user }}</span></div><a href="/logout">Sair</a></header><main><section class="hero card"><h1>Consulta de Estoque</h1><p>Digite ou leia o RG da caixa/palete.</p><div class="search"><input id="rg" placeholder="Digite ou leia o RG" autofocus><button onclick="consultar()">🔎 Consultar</button></div><button class="secondary" onclick="startScanner()">📷 Ler QR Code</button><div id="reader"></div><div id="result"></div></section></main><script>
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function consultar(){let rg=document.getElementById('rg').value.trim();if(!rg)return;try{let d=await api('/api/rg/'+encodeURIComponent(rg));document.getElementById('result').innerHTML=d.found?'<div class="ok"><h2>✓ RG localizado</h2><p><b>Posição esperada:</b> '+esc(d.posicao)+'</p><p><b>Produto:</b> '+esc(d.produto)+'</p><p><b>Lote:</b> '+esc(d.lote)+'</p><p><b>Validade:</b> '+esc(d.validade)+'</p><p><b>Quantidade:</b> '+esc(d.quantidade)+'</p><p><b>Status:</b> '+esc(d.status)+'</p></div>':'<div class="bad"><h2>⚠ RG não encontrado</h2><p>'+esc(d.rg)+'</p></div>'}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
let scanner;function startScanner(){if(scanner)return;scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:180}},t=>{document.getElementById('rg').value=t;scanner.stop().then(()=>{scanner=null;consultar()})}).catch(e=>{scanner=null;alert('Não foi possível acessar a câmera: '+e)})}
document.getElementById('rg').addEventListener('keydown',e=>{if(e.key==='Enter')consultar()});
</script></body></html>
