<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta RG • Administração</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><strong>Consulta RG • Administração</strong><span> • {{ user.user }}</span></div><a href="/logout">Sair</a></header><main><section class="grid"><div class="card"><h2>📥 Base diária</h2><p>Importe o Excel mais recente do WYMS para substituir a base ativa.</p><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="importar()">Importar Excel</button><div id="importMsg"></div></div><div class="card"><h2>📊 Indicadores</h2><div class="stats"><div><b id="count">0</b><span>RGs ativos</span></div><div><b id="consulted">0</b><span>RGs consultados</span></div><div><b id="imports">0</b><span>importações</span></div></div></div></section><section class="card"><h2>📋 Histórico de importações</h2><div id="history">Carregando...</div></section></main><script>
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function importar(){let f=document.getElementById('file').files[0];if(!f)return alert('Selecione um Excel.');let fd=new FormData();fd.append('file',f);try{let d=await api('/api/import',{method:'POST',body:fd});document.getElementById('importMsg').innerHTML='<div class="ok">Importação concluída: '+d.rows+' linhas.</div>';load()}catch(e){document.getElementById('importMsg').innerHTML='<div class="bad">'+e.message+'</div>'}}
async function load(){let s=await api('/api/stats');document.getElementById('count').textContent=Number(s.rg_count||0).toLocaleString('pt-BR');document.getElementById('consulted').textContent=Number(s.rg_consultados||0).toLocaleString('pt-BR');document.getElementById('imports').textContent=Number(s.imports||0).toLocaleString('pt-BR');let h=await api('/api/imports');document.getElementById('history').innerHTML=h.map(x=>'<p><b>#'+x.id+'</b> '+esc(x.filename)+' — '+x.rows+' linhas</p>').join('')||'Nenhuma importação.'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
