<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><link rel="manifest" href="/static/manifest.json"><title>Consulta RG • Offline</title><link rel="stylesheet" href="/static/style.css"></head><body><header><strong>Consulta RG • Operacional</strong><span> • MODO OFFLINE</span></header><main><section class="hero card"><h1>Consulta de Estoque</h1><p>Sem internet. Consultando a última base sincronizada neste aparelho.</p><div class="offline-bar"><span>🟠 OFFLINE</span><span id="status">Carregando base local...</span></div><div class="search"><input id="rg" placeholder="Digite ou leia o RG" autofocus><button onclick="consultar()">🔎 Consultar</button></div><div id="result"></div></section></main><script>
const DB='consulta-rg-offline',S='estoque',M='meta';
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(rg){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(S).objectStore(S).get(rg);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
async function meta(){const db=await openDB();return new Promise((ok,no)=>{const r=db.transaction(M).objectStore(M).get('base');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function consultar(){const rg=document.getElementById('rg').value.trim();if(!rg)return;const d=await get(rg);document.getElementById('result').innerHTML=d?'<div class="ok"><h2>✓ RG localizado • OFFLINE</h2><p><b>Posição esperada:</b> '+esc(d.posicao)+'</p><p><b>COD. PRODUTO:</b> '+esc(d.cod_produto)+'</p><p><b>Produto:</b> '+esc(d.produto)+'</p><p><b>Lote:</b> '+esc(d.lote)+'</p><p><b>Validade:</b> '+esc(d.validade)+'</p><p><b>Quantidade:</b> '+esc(d.quantidade)+'</p><p><b>Status:</b> '+esc(d.status)+'</p></div>':'<div class="bad"><h2>⚠ RG não encontrado • OFFLINE</h2><p>'+esc(rg)+'</p></div>'}
document.getElementById('rg').addEventListener('keydown',e=>{if(e.key==='Enter')consultar()});meta().then(m=>document.getElementById('status').textContent=m?'Base: '+Number(m.count||0).toLocaleString('pt-BR')+' RGs • '+new Date(m.imported_at).toLocaleString('pt-BR'):'Nenhuma base sincronizada');</script></body></html>
