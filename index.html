<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta RG • Estoque</title><link rel="stylesheet" href="/static/style.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><header><div><strong>Consulta RG • Estoque</strong><span id="user"></span></div><a href="/logout">Sair</a></header><main><section class="grid"><div class="card"><h2>Consulta</h2><div class="search"><input id="rg" placeholder="Digite ou leia o RG"><button onclick="consultar()">Consultar</button></div><div id="reader"></div><button class="secondary" onclick="startScanner()">📷 Ler QR Code</button><div id="result"></div></div><div class="card"><h2>Base diária</h2><p>Importe o Excel mais recente para substituir a base ativa.</p><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="importar()">Importar Excel</button><div id="importMsg"></div></div></section><section class="grid"><div class="card"><h2>Indicadores</h2><div class="stats"><div><b id="count">0</b><span>RGs ativos</span></div><div><b id="imports">0</b><span>importações</span></div></div></div><div class="card"><h2>Histórico</h2><div id="history">Carregando...</div></div></section></main><script>
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function consultar(){let rg=document.getElementById('rg').value.trim();if(!rg)return;try{let d=await api('/api/rg/'+encodeURIComponent(rg));document.getElementById('result').innerHTML=d.found?`<div class="ok"><h3>RG localizado</h3><p><b>Posição:</b> ${esc(d.posicao)}</p><p><b>Produto:</b> ${esc(d.produto)}</p><p><b>Lote:</b> ${esc(d.lote)}</p><p><b>Validade:</b> ${esc(d.validade)}</p><p><b>Quantidade:</b> ${esc(d.quantidade)}</p><p><b>Status:</b> ${esc(d.status)}</p></div>`:`<div class="bad"><h3>RG não encontrado</h3><p>${esc(d.rg)}</p></div>`}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
let scanner;function startScanner(){if(scanner)return;scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:180}},t=>{document.getElementById('rg').value=t;scanner.stop().then(()=>{scanner=null;consultar()})}).catch(e=>{scanner=null;alert('Não foi possível acessar a câmera: '+e)})}
async function importar(){let f=document.getElementById('file').files[0];if(!f)return alert('Selecione um Excel.');let fd=new FormData();fd.append('file',f);try{let d=await api('/api/import',{method:'POST',body:fd});document.getElementById('importMsg').innerHTML=`<div class="ok">Importação concluída: ${d.rows} linhas.</div>`;load()}catch(e){document.getElementById('importMsg').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}
async function load(){let s=await api('/api/stats');document.getElementById('count').textContent=s.rg_count;document.getElementById('imports').textContent=s.imports;let h=await api('/api/imports');document.getElementById('history').innerHTML=h.map(x=>`<p><b>#${x.id}</b> ${esc(x.filename)} — ${x.rows} linhas</p>`).join('')||'Nenhuma importação.'}load();
</script></body></html>
